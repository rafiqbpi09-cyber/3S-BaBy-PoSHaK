<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby Poshak</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%B6%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#e85d8a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff8fab; --pink-dark:#e85d8a; --cream:#fff8f2; --card:#ffffff;
  --text:#3a2e2e; --muted:#8a7b7b; --border:#f0dfe3; --accent:#7fd8be;
  --bg:var(--cream); --shadow:0 4px 14px rgba(232,93,138,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#221a1d; --card:#2e2427; --text:#f5e9ea; --muted:#b39a9a; --border:#4a3a3d; }
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff;padding:10px max(16px,calc((100vw - 1680px)/2 + 24px));display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);gap:10px;}
header h1{margin:0;font-size:20px;cursor:pointer;white-space:nowrap;}
.navicons{display:flex;gap:18px;align-items:center;}
.navicon{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:11px;color:#fff;position:relative;}
.navicon span.ic{font-size:18px;}
.navicon .bagico{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));}
.navbadge{position:absolute;top:-6px;right:-10px;background:#fff;color:var(--pink-dark);border-radius:10px;font-size:10px;font-weight:800;padding:1px 5px;}
.megaoverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:45;}
.megaoverlay.open{display:block;}
.tabbtn{background:rgba(255,255,255,.25);border:none;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;}
.tabbtn.active{background:#fff;color:var(--pink-dark);font-weight:600;}
main{max-width:1680px;margin:0 auto;padding:16px 24px 90px;}
.hidden{display:none !important;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);border:1px solid var(--border);display:flex;flex-direction:column;}
.pimg{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;margin-bottom:8px;background:var(--bg);}
.emojibox{display:flex;align-items:center;justify-content:center;font-size:56px;}
.emoji{font-size:40px;text-align:center;margin-bottom:6px;}
.pname{font-weight:600;font-size:15px;margin:4px 0 2px;}
.pprice{color:var(--pink-dark);font-weight:700;}
.pstock{font-size:12px;color:var(--muted);}
.pstock.low{color:#d9534f;font-weight:600;}
.hero{position:relative;overflow:hidden;border-radius:14px;margin-bottom:14px;box-shadow:var(--shadow);background:var(--card);}
.herotrack{display:flex;will-change:transform;}
.heroslide{flex:0 0 100%;position:relative;aspect-ratio:8/3;max-height:380px;}
.heroslide img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none;}
.herocap{position:absolute;left:0;right:0;bottom:0;padding:22px 22px 18px;color:#fff;font-weight:800;font-size:20px;background:linear-gradient(transparent,rgba(0,0,0,.6));}
.heroarrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.88);border:none;width:38px;height:38px;border-radius:50%;font-size:24px;line-height:1;cursor:pointer;z-index:2;color:#333;}
.heroarrow.left{left:12px;}
.heroarrow.right{right:12px;}
.herodots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2;}
.herodots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.6);cursor:pointer;transition:all .25s;}
.herodots span.on{background:#fff;width:22px;border-radius:6px;}
@media (max-width:700px){
  .heroslide{aspect-ratio:16/9;}
  .heroarrow{display:none;}
  .herocap{font-size:14px;padding:16px 14px 20px;}
}
.cardbadge{position:absolute;left:0;top:0;z-index:1;padding:3px 9px;border-radius:0 0 8px 0;font-size:11px;font-weight:800;color:#fff;}
.badge-off{background:var(--pink-dark);}
.badge-new{background:#17a2b8;}
.sizepills{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0;}
.sizepills span{border:1px solid var(--border);border-radius:10px;padding:1px 8px;font-size:10px;color:var(--muted);}
.quickshop{background:#20504a;letter-spacing:.5px;font-size:12px;text-transform:uppercase;}
button.buy{width:100%;margin-top:8px;background:var(--pink);color:#fff;border:none;padding:9px;border-radius:10px;font-weight:600;cursor:pointer;}
button.buy:disabled{background:#ccc;cursor:not-allowed;}
.cartfab{position:fixed;bottom:20px;right:20px;background:var(--pink-dark);color:#fff;border:none;border-radius:50px;padding:14px 20px;font-weight:700;box-shadow:var(--shadow);cursor:pointer;z-index:20;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--card);width:100%;max-width:500px;border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow-y:auto;position:relative;}
.cartrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.qtybtn{background:var(--border);border:none;width:26px;height:26px;border-radius:50%;cursor:pointer;font-weight:700;}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;margin:6px 0 12px;background:var(--card);color:var(--text);font-size:14px;}
label{font-size:13px;color:var(--muted);}
.total{font-size:18px;font-weight:700;margin:10px 0;}
.primary{background:var(--pink-dark);color:#fff;border:none;padding:12px;border-radius:10px;font-weight:700;cursor:pointer;}
.secondary{background:var(--border);color:var(--text);border:none;padding:12px;border-radius:10px;font-weight:600;cursor:pointer;}
.close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:12px;overflow:hidden;}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--border);}
th{background:var(--border);}
.smallbtn{padding:5px 9px;border-radius:6px;border:none;font-size:12px;cursor:pointer;margin-right:4px;}
.edit{background:var(--accent);color:#083b2c;}
.del{background:#d9534f;color:#fff;}
.overflow-x{overflow-x:auto;}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:18px;}
.stat{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);text-align:center;}
.statnum{font-size:24px;font-weight:800;color:var(--pink-dark);}
.statlabel{font-size:12px;color:var(--muted);}
.subtabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.subtabs button{background:var(--card);border:1px solid var(--border);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;}
.subtabs button.active{background:var(--pink);color:#fff;border-color:var(--pink);}
.note{font-size:12px;color:var(--muted);margin-top:10px;}
.breadcrumb{font-size:12px;color:var(--muted);margin-bottom:10px;}
.detail-gallery{display:flex;gap:8px;margin-bottom:10px;}
.thumbs{display:flex;flex-direction:column;gap:6px;}
.thumbs img{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer;}
.mainimg{flex:1;width:100%;max-height:240px;object-fit:cover;border-radius:12px;cursor:zoom-in;}
.oldprice{text-decoration:line-through;color:var(--muted);font-size:14px;margin-left:6px;}
.qtyrow{display:flex;align-items:center;gap:10px;margin:10px 0;}
.qtybox{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:4px 10px;}
.btn2col{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;}
.btn2col a,.btn2col button{display:block;text-align:center;text-decoration:none;padding:11px;border-radius:9px;font-weight:700;font-size:13px;border:none;cursor:pointer;}
.bt-cart{background:var(--pink);color:#fff;}
.bt-order{background:#222;color:#fff;}
.bt-call{background:#222;color:#fff;}
.bt-wa{background:#25D366;color:#fff;}
.sharegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0;}
.sharegrid button{border:none;border-radius:8px;padding:8px 4px;font-size:11px;cursor:pointer;font-weight:700;color:#fff;}
.sh-fb{background:#1877F2;}
.sh-msg{background:linear-gradient(45deg,#00B2FF,#006AFF,#A033FF,#FF5280);}
.sh-wa{background:#25D366;}
.sh-copy{background:#6c6c6c;}
.tl{margin:14px 0 6px;}
.tl-step{display:flex;gap:10px;position:relative;padding-bottom:16px;}
.tl-step:not(:last-child)::before{content:'';position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--border);}
.tl-step.done:not(:last-child)::before{background:#2bb673;}
.tl-dot{width:22px;height:22px;border-radius:50%;background:var(--border);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tl-step.done .tl-dot{background:#2bb673;}
.tl-step.now .tl-dot{box-shadow:0 0 0 4px rgba(43,182,115,.25);}
.tl-time{font-size:11px;color:var(--muted);}
.ordercard{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:10px;cursor:pointer;}
.ordercard small{color:var(--muted);}
.stbadge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:#e6f9f0;color:#0e9f6e;}
.stbadge.Cancelled{background:#ffe3e3;color:#c92a2a;}
.bankcard{background:#eef4ff;border:1px solid #cfdcf7;border-radius:12px;padding:12px 14px;margin:6px 0 14px;font-size:13px;color:#1f2937;}
.bankcard .bankhead{font-weight:800;color:#1e3a8a;margin-bottom:8px;font-size:14px;}
.bankcard .bankrow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #cfdcf7;}
.bankcard .bankrow span{color:#6b7280;}
.bankcard .bankrow b{text-align:right;word-break:break-all;}
.courierbox{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13px;line-height:1.7;}
.features-list{margin:8px 0;padding-left:18px;font-size:13px;}
.features-list li{margin-bottom:3px;}
.storelayout{display:flex;gap:16px;align-items:flex-start;}
.sidebar{width:220px;flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow-y:auto;}
@media (min-width:1200px){.sidebar{width:250px;}}
.sidebar h4{margin:14px 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.offercard{background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff;border-radius:12px;margin-bottom:14px;cursor:pointer;min-height:76px;opacity:1;transition:opacity .4s ease;position:relative;overflow:hidden;display:flex;align-items:stretch;}
.offercard .ofcontent{padding:12px 16px;flex:1;min-width:0;}
.offercard.has-img img{width:110px;min-height:96px;height:auto;object-fit:cover;display:block;flex-shrink:0;}
.offercard.fade{opacity:0;}
.offercard .oftag{display:inline-block;background:rgba(255,255,255,.25);padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700;margin-bottom:4px;}
.offercard .oftitle{font-weight:800;font-size:15px;margin-bottom:2px;}
.offercard .ofdesc{font-size:12px;opacity:.95;}
.offercard .ofdots{display:flex;gap:4px;margin-top:8px;}
.offercard .ofdots span{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.4);}
.offercard .ofdots span.on{background:#fff;}
.offercard{flex-wrap:wrap;}
.offercard .ofcd{flex:0 0 100%;background:rgba(0,0,0,.24);border-top:1px dashed rgba(255,255,255,.55);padding:10px 10px 12px;text-align:center;cursor:default;}
.ofcd-label{font-size:17px;font-weight:900;letter-spacing:.3px;color:#fff;animation:ofblink 1.1s ease-in-out infinite;}
.ofcd-label .sp{display:inline-block;animation:oftwinkle 1.1s ease-in-out infinite;}
.ofcd-label .sp:last-child{animation-delay:.55s;}
.ofcd-boxes{display:flex;justify-content:center;gap:8px;margin:9px 0 8px;}
.ofcd .cdb{min-width:60px;background:#fff;color:var(--pink-dark);border-radius:11px;padding:6px 6px 5px;box-shadow:0 0 0 2px rgba(255,255,255,.45),0 0 14px rgba(255,255,255,.75);animation:ofglow 1.4s ease-in-out infinite;}
.ofcd .cdb b{display:block;font-size:30px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;}
.ofcd .cdb i{display:block;font-style:normal;font-size:12px;font-weight:800;margin-top:1px;}
.ofcd .cdb.sec{animation:ofpulse 1s ease-in-out infinite;}
.ofcd-end{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 6px;font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);}
.ofcd-end b{background:rgba(255,255,255,.22);padding:3px 10px;border-radius:12px;}
.ofcd .ofhurry{display:none;margin-top:7px;font-size:14px;font-weight:900;color:#fff176;animation:ofblink .7s ease-in-out infinite;}
.ofcd.urgent .ofhurry{display:block;}
.ofcd.urgent .cdb{color:#d90429;}
@keyframes ofblink{0%,100%{opacity:1;text-shadow:0 0 10px #fff,0 0 22px #ffd54a;}50%{opacity:.5;text-shadow:none;}}
@keyframes oftwinkle{0%,100%{transform:scale(1) rotate(0);opacity:1;}50%{transform:scale(1.5) rotate(25deg);opacity:.4;}}
@keyframes ofglow{0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.45),0 0 10px rgba(255,255,255,.55);}50%{box-shadow:0 0 0 3px rgba(255,255,255,.8),0 0 22px rgba(255,235,120,.95);}}
@keyframes ofpulse{0%,100%{transform:scale(1);}50%{transform:scale(1.09);}}
@media (max-width:700px){
  .ofcd-label{font-size:15px;}
  .ofcd-boxes{gap:6px;}
  .ofcd .cdb{min-width:0;flex:1 1 0;max-width:74px;padding:5px 2px 4px;}
  .ofcd .cdb b{font-size:25px;}
  .ofcd .cdb i{font-size:11px;}
}
@media (prefers-reduced-motion:reduce){ .ofcd-label,.ofcd-label .sp,.ofcd .cdb,.ofcd .ofhurry{animation:none;} }
.sidebar h4:first-child{margin-top:0;}
.sidebar-link{display:flex;justify-content:space-between;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:13px;}
.sidebar-link:hover{background:var(--border);}
.sidebar-link.active{background:var(--pink);color:#fff;}
.sidebar-link .cnt{color:var(--muted);font-size:11px;}
.sidebar-link.active .cnt{color:#fff;}
.sidebar-subs{margin:2px 0 8px 10px;border-left:2px solid var(--border);padding-left:6px;}
.sidebar-sub{display:flex;justify-content:space-between;gap:6px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:12px;}
.sidebar-sub:hover{background:var(--border);}
.sidebar-sub.active{color:var(--pink-dark);font-weight:700;background:var(--border);}
.sidebar-sub .cnt{color:var(--muted);font-size:11px;}
.storecontent{flex:1;min-width:0;}
.searchbar{position:relative;margin-bottom:14px;}
.searchbar input{padding:12px 12px 12px 38px;border-radius:10px;margin:0;}
.searchbar span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);}
.quickpills{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.qpill{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:30px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;}
.qpill.active{outline:2px solid currentColor;}
.qp-blue{background:#e8f1ff;color:#2563eb;}
.qp-pink{background:#ffe8ef;color:#e11d6f;}
.qp-green{background:#e6f9f0;color:#0e9f6e;}
.qp-purple{background:#f1e8ff;color:#7c3aed;}
.mobile-filter-toggle{display:none;}
@media (max-width:700px){
  .sidebar{width:132px;padding:10px;font-size:12px;}
  .sidebar h4{font-size:10px;margin:10px 0 5px;}
  .sidebar-link,.sidebar-sub{font-size:11px;padding:5px 4px;}
  .storelayout{gap:8px;}
  .main-inner{padding-left:2px;}
  main{padding:12px 12px 90px;}
  header{padding:8px 12px;}
  header h1{font-size:17px;}
  .navicons{gap:12px;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
  .pimg{aspect-ratio:4/3;}
  .offercard.has-img img{width:84px;min-height:84px;}
  .whatsfab{width:44px;height:44px;font-size:20px;bottom:68px;right:12px;}
  .cartfab{right:12px;bottom:14px;padding:10px 16px;}
}
@media (max-width:380px){
  .navicon small{display:none;}
  .navicons{gap:10px;}
}
/* ---------- Floating cart button (WhatsApp বাটনের সমান গোল, ভেতরের আইকন একটু বড়) ---------- */
.cartfab{display:flex;align-items:center;justify-content:center;width:52px;height:52px;padding:0;border-radius:50%;font-size:12px;}
.cartfab.hidden{display:none;}
.cartfab .cartic{font-size:30px;line-height:1;}
.cartfab #cartCount{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#fff;color:var(--pink-dark);font-size:11px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25);}
@media (max-width:700px){ .cartfab{width:52px;height:52px;padding:0;right:20px;bottom:20px;} .cartfab .cartic{font-size:30px;} }
/* ---------- Language switch ---------- */
header h1{min-width:0;overflow:hidden;}
.brandtext{min-width:0;}
.bname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navicons{flex-shrink:0;}
.langsw{display:inline-flex;align-items:center;background:rgba(255,255,255,.22);border-radius:999px;padding:2px;gap:2px;flex:0 0 auto;}
.langsw button{border:none;background:transparent;color:#fff;font-weight:700;font-size:12px;line-height:1;padding:6px 10px;border-radius:999px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.langsw button.on{background:#fff;color:var(--pink-dark);box-shadow:0 1px 4px rgba(0,0,0,.18);}
.langtoggle{display:none;border:1.5px solid rgba(255,255,255,.85);background:rgba(255,255,255,.18);color:#fff;font-weight:800;font-size:11px;line-height:1;padding:6px 8px;border-radius:999px;cursor:pointer;font-family:inherit;white-space:nowrap;flex:0 0 auto;}
.sb-lang{display:none;}
@media (max-width:700px){
  header .langsw{display:none;}
  .langtoggle{display:inline-block;}
  header .brandtext{font-size:clamp(12px,3.8vw,17px);}
  .sb-lang{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:8px 10px;margin:8px 0 4px;font-size:13px;font-weight:600;}
  .sb-lang .langsw{background:var(--border);}
  .sb-lang .langsw button{color:var(--text);}
  .sb-lang .langsw button.on{background:var(--pink-dark);color:#fff;}
}
@media (max-width:420px){
  header{gap:6px;}
  header .brandlogo{width:36px;height:36px;}
  header .brandtext{margin-left:5px;gap:4px;font-size:clamp(10px,3.4vw,14px);letter-spacing:0;}
  header .bname{letter-spacing:0;font-size:1em;}
  header .b3s{padding:2px 5px 3px;border-radius:8px;}
  .navicons{gap:8px;}
  .langtoggle{font-size:10.5px;padding:5px 7px;}
}
/* ---------- Mobile: filter menu behind ⋮ (three dots) ---------- */
.searchrow{display:flex;gap:8px;align-items:flex-start;}
.searchrow .searchbar{flex:1;min-width:0;}
.dotsbtn{display:none;}
.sb-head{display:none;}
.sb-head + h4{margin-top:0;}
.sb-backdrop{display:none;}
@media (max-width:700px){
  .storelayout{display:block;}
  .storecontent{width:100%;}
  .dotsbtn{display:flex;align-items:center;justify-content:center;gap:5px;flex:0 0 auto;height:40px;padding:0 12px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--pink-dark);cursor:pointer;box-shadow:var(--shadow);}
  .dotsbtn .dl{font-size:14px;font-weight:700;line-height:1;}
  .dotsbtn .dd{font-size:22px;font-weight:900;line-height:1;}
  .searchrow{align-items:center;margin-bottom:12px;}
  .searchrow .searchbar{margin-bottom:0;}
  .searchrow .searchbar input{height:40px;box-sizing:border-box;padding:6px 10px 6px 32px;font-size:13px;border-radius:10px;}
  .searchrow .searchbar span{left:10px;font-size:14px;}
  .dotsbtn:active{background:var(--border);}
  .sidebar{position:fixed;top:0;left:0;bottom:0;height:100%;max-height:none;width:min(82vw,320px);z-index:50;border-radius:0 18px 18px 0;padding:14px 16px 24px;font-size:14px;transform:translateX(-105%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s;box-shadow:6px 0 28px rgba(0,0,0,.25);overflow-y:auto;}
  .sidebar.open{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s;}
  .sidebar h4{font-size:11px;margin:16px 0 8px;}
  .sidebar-link{font-size:14px;padding:9px 10px;}
  .sidebar-sub{font-size:13px;padding:7px 10px;}
  .sb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:16px;color:var(--text);}
  .sb-head button{background:var(--border);border:none;width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;color:var(--text);}
  .sb-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:49;display:none;}
  .sb-backdrop.show{display:block;animation:qsfade .2s ease-out;}
  .quickpills{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;}
  .quickpills::-webkit-scrollbar{display:none;}
  .qpill{flex:0 0 auto;white-space:nowrap;}
}
/* ---------- Quick Shop popup, toast, trx box ---------- */
.qsov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45;display:flex;align-items:center;justify-content:center;padding:16px;animation:qsfade .15s ease-out;}
.qsbox{background:var(--card);color:var(--text);border-radius:18px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto;padding:18px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:qspop .18s ease-out;}
.qsbox .close{top:10px;right:12px;z-index:2;background:rgba(255,255,255,.9);border-radius:50%;width:32px;height:32px;font-size:16px;color:#444;}
.qsimg{display:block;width:100%;height:220px;object-fit:cover;border-radius:12px;background:var(--border);margin-bottom:10px;}
.qsemoji{display:flex;align-items:center;justify-content:center;font-size:90px;}
.qsname{margin:4px 0 2px;font-size:17px;}
.qsbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 6px;}
.qsbtns button{padding:11px 6px;border-radius:9px;font-weight:700;font-size:13px;border:none;cursor:pointer;}
.qslink{display:block;width:100%;background:none;border:none;color:var(--pink-dark);font-weight:700;font-size:13px;cursor:pointer;padding:8px;}
@keyframes qsfade{from{opacity:0;}to{opacity:1;}}
@keyframes qspop{from{opacity:0;transform:scale(.92) translateY(10px);}to{opacity:1;transform:none;}}
.bptoast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;font-weight:600;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:qsfade .15s ease-out;}
.trxbox{background:#fff8e6;border:1px solid #f3dfa2;border-radius:12px;padding:12px 14px;margin:6px 0 14px;}
.trxbox input{margin-bottom:0;text-transform:uppercase;letter-spacing:.5px;}
.trxbox input::placeholder{text-transform:none;letter-spacing:0;font-size:13px;}
/* ---------- Footer ---------- */
main{padding-bottom:36px;}
.bpfoot{background:#1a1316;color:#e9dfe1;margin-top:8px;font-size:13.5px;}
.bpfoot a{color:#f3e8ea;text-decoration:none;}
.bpfoot a:hover{color:var(--pink);}
.bpfoot-in{max-width:1680px;margin:0 auto;padding:34px 24px 26px;display:grid;grid-template-columns:1.3fr 1.3fr .8fr;gap:30px;}
.bpfoot h4{margin:0 0 14px;font-size:16px;font-weight:700;color:#fff;padding-left:10px;border-left:3px solid var(--pink);line-height:1.2;}
.fbrandrow{display:flex;align-items:center;gap:12px;}
.flogo{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.18);flex:0 0 auto;}
.fname{display:flex;align-items:center;gap:8px;font-family:'Fredoka','Baloo 2','Comic Sans MS',system-ui,sans-serif;font-weight:700;line-height:1;}
.fname .f3s{display:inline-flex;background:#fff;border-radius:11px;padding:3px 8px 4px;font-size:22px;}
.fname .f3s i{font-style:normal;}
.fname .f3s i:first-child{color:#0a7fd6;}
.fname .f3s i:last-child{color:var(--pink-dark);}
.fname .fn{font-size:24px;color:#fff;}
.ftag{margin:12px 0 14px;color:#bda9ad;font-size:13px;}
.fsocial{display:flex;gap:10px;}
.fsocial a{width:38px;height:38px;border:1.5px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;}
.fsocial a svg{width:18px;height:18px;}
.fsocial a:hover{background:var(--pink-dark);border-color:var(--pink-dark);color:#fff;}
.frow{display:flex;gap:8px;line-height:1.7;margin-bottom:10px;}
.frow .fl{flex:0 0 auto;color:#bda9ad;min-width:62px;}
.frow .fv{display:flex;flex-direction:column;}
.flinks{display:flex;flex-direction:column;gap:9px;}
.flinks a{cursor:pointer;}
.fbar{background:#0d0a0b;text-align:center;padding:14px 16px;font-size:12px;color:#d9ccce;}
@media (max-width:820px){
  .bpfoot-in{grid-template-columns:1fr;gap:24px;padding:26px 16px 18px;}
  .fbar{padding-bottom:70px;}
}
/* ---------- Header logo ---------- */
header h1{display:flex;align-items:center;line-height:0;}
.brandlogo{display:block;width:46px;height:46px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.75),0 2px 8px rgba(0,0,0,.18);user-select:none;-webkit-user-drag:none;}
@media (max-width:700px){ .brandlogo{width:40px;height:40px;} }
.brandtext{display:flex;align-items:center;gap:8px;margin-left:10px;font-family:'Fredoka','Baloo 2','Comic Sans MS',system-ui,sans-serif;font-weight:700;letter-spacing:.4px;line-height:1;}
.b3s{display:inline-flex;background:#fff;border-radius:12px;padding:3px 9px 4px;font-size:1.05em;box-shadow:0 2px 6px rgba(0,0,0,.15);}
.b3s i{font-style:normal;}
.b3s i:first-child{color:#0a7fd6;}
.b3s i:last-child{color:var(--pink-dark);}
.bname{font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.14);}
.brandtext{font-size:22px;}
@media (max-width:700px){
  .brandtext{margin-left:7px;gap:6px;font-size:clamp(13px,4.3vw,18px);}
  .bname{font-size:1em;}
  .b3s{border-radius:9px;padding:2px 6px 3px;}
}
/* ---------- Announcement ticker ---------- */
.tkbar{display:flex;align-items:stretch;background:var(--card);border-bottom:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;position:relative;}
.tkbar:empty{display:none;}
.tklabel{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:0 12px;background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff;font-weight:800;font-size:13px;position:relative;z-index:2;}
.tkwrap{flex:1 1 auto;min-width:0;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent);}
.tktrack{display:flex;width:max-content;will-change:transform;animation:tkscroll linear infinite;}
.tkgroup{display:flex;flex:0 0 auto;align-items:center;}
.tkmic{width:34px;height:24px;display:block;overflow:visible;}
.tkbody{transform-origin:10px 12px;animation:tkpulse 1.4s ease-in-out infinite;}
.tkw{opacity:0;animation:tkwave 1.4s ease-out infinite;}
.tkw2{animation-delay:.22s;}
.tkw3{animation-delay:.44s;}
@keyframes tkwave{0%{opacity:0;transform:translateX(-4px);}35%{opacity:1;}100%{opacity:0;transform:translateX(4px);}}
@keyframes tkpulse{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}
.tkitem{white-space:nowrap;padding:9px 0;font-size:14px;font-weight:600;color:var(--pink-dark);}
.tkitem::after{content:"✦";display:inline-block;margin:0 22px;color:var(--accent);font-size:12px;}
.tkbar:hover .tktrack,.tkbar.paused .tktrack{animation-play-state:paused;}
@keyframes tkscroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
@media (max-width:700px){
  .tklabel{padding:0 9px;font-size:12px;}
  .tkmic{width:28px;height:20px;}
  .tkitem{font-size:13px;padding:8px 0;}
  .tkitem::after{margin:0 16px;}
}
@media (prefers-reduced-motion:reduce){
  .tktrack{animation:none;}
  .tkw{animation:none;opacity:.9;}
  .tkbody{animation:none;}
  .tkwrap{overflow-x:auto;}
}
.whatsfab{position:fixed;bottom:84px;right:20px;background:#25D366;color:#fff;border:none;border-radius:50%;width:52px;height:52px;box-shadow:var(--shadow);z-index:20;font-size:24px;display:flex;align-items:center;justify-content:center;text-decoration:none;}
</style>

<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ⚠️ এখানে আপনার বিজনেসের আসল ফোন/হোয়াটসঅ্যাপ নম্বর বসান (দেশের কোড সহ, + ছাড়া)
const BUSINESS_PHONE = "8801712863183";
// ⚠️ ডেলিভারি চার্জ — প্রয়োজনমতো বদলে নিন
const DELIVERY_CHARGES = { 'ঢাকার ভিতরে': 70, 'ঢাকার বাইরে': 130 };
// ব্যাংক ট্রান্সফারের অ্যাকাউন্ট তথ্য
const BANK_ACCOUNTS = {
  'Pubali Bank PLC': { accountName:'Md Rafiqul Islam', branch:'Faridpur Branch', accountNumber:'0427101108526' },
  'Islami Bank PLC': { accountName:'Md Rafiqul Islam', branch:'Barguna Branch', accountNumber:'20502340202266600' }
};
function bankCardHtml(pay){
  const b = BANK_ACCOUNTS[pay]; if(!b) return '';
  return `<div class="bankcard">
    <div class="bankhead">🏦 ${esc(pay)}</div>
    <div class="bankrow"><span>Account Name</span><b>${esc(b.accountName)}</b></div>
    <div class="bankrow"><span>Branch</span><b>${esc(b.branch)}</b></div>
    <div class="bankrow"><span>Account Number</span><b>${esc(b.accountNumber)}</b></div>
    <button type="button" class="secondary" style="width:100%;margin-top:8px;padding:9px" onclick="copyAccountNo('${esc(b.accountNumber)}')">📋 অ্যাকাউন্ট নম্বর কপি করুন</button>
    <p class="note" style="margin:8px 0 0">এই অ্যাকাউন্টে মোট টাকা পাঠিয়ে ট্রান্সফারের স্ক্রিনশট/রেফারেন্স নম্বর আমাদের WhatsApp-এ পাঠান। পেমেন্ট যাচাই হলে অর্ডার কনফার্ম করা হবে।</p>
  </div>`;
}
function copyAccountNo(n){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(n).then(()=>alert('অ্যাকাউন্ট নম্বর কপি হয়েছে'), ()=>alert('কপি করা যায়নি, নম্বরটি নিজে কপি করুন: '+n));
  } else { alert('অ্যাকাউন্ট নম্বর: '+n); }
}
function updatePayInfo(){
  const box = document.getElementById('payInfoBox'); if(!box) return;
  const pay = document.getElementById('cPay').value;
  const old = document.getElementById('cTrx');
  const keep = old ? old.value : '';
  let html = bankCardHtml(pay);
  if(pay !== 'Cash on Delivery'){
    html += `<div class="trxbox"><label style="margin-top:0;font-weight:700">ট্রানজেকশন ID <span style="color:#c92a2a">*</span> (আবশ্যক)</label>
      <input id="cTrx" maxlength="40" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="${esc(pay)} ট্রানজেকশন ID / রেফারেন্স নম্বর">
      <p class="note" style="margin:6px 0 0">টাকা পাঠানোর পর পাওয়া ট্রানজেকশন ID এখানে লিখুন। ট্রানজেকশন ID না দিলে অর্ডার কনফার্ম হবে না।</p></div>`;
  }
  box.innerHTML = html;
  const n = document.getElementById('cTrx'); if(n && keep) n.value = keep;
}
let offerPriceOverride = {};
function priceFor(id){
  const p = products.find(x=>x.id===id);
  if(offerPriceOverride[id] && p && offerPriceOverride[id] < p.price) return offerPriceOverride[id];
  return p ? (Number(p.price)||0) : 0;
}

  const t = document.getElementById('heroTrack'); if(!t) return;
  t.style.transition = animate ? 'transform .6s ease' : 'none';
  t.style.transform = 'translateX(-' + (heroIdx*100) + '%)';

}
function heroSet(i){ if(!banners.length) return; heroIdx = (i + banners.length) % banners.length; applyHero(true); }

  if(heroTimer) clearInterval(heroTimer);

  if(heroSwiped) return;

}
function attachHeroSwipe(){
  const el = document.querySelector('.hero'); if(!el) return;
  let x0 = null;
  el.addEventListener('touchstart', e=>{ x0 = e.touches[0].clientX; heroPaused = true; }, {passive:true});
  el.addEventListener('touchend', e=>{
    heroPaused = false;
    if(x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if(Math.abs(dx) > 40){ heroSwiped = true; setTimeout(()=>{ heroSwiped = false; }, 350); heroGo(dx < 0 ? 1 : -1); }
  }, {passive:true});
}

function renderTicker(){
  const bar = document.getElementById('tickerBar');
  if(!bar) return;

  const one = tickerItems.map(t=>`<span class="tkitem">${esc2(t.text)}</span>`).join('');
  bar.innerHTML = `<div class="tklabel" aria-hidden="true"><svg class="tkmic" viewBox="0 0 38 24" aria-hidden="true"><g class="tkbody" fill="#fff"><rect x="2" y="9" width="5" height="6" rx="1.2"/><path d="M8 9 L18 4 V20 L8 15 Z"/><rect x="18" y="3.5" width="2.6" height="17" rx="1.3"/><rect x="6" y="15" width="3" height="5" rx="1"/></g><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path class="tkw tkw1" d="M24 9 Q27 12 24 15"/><path class="tkw tkw2" d="M27.5 6.5 Q32 12 27.5 17.5"/><path class="tkw tkw3" d="M31 4 Q37 12 31 20"/></g></svg></div><div class="tkwrap"><div class="tktrack"><div class="tkgroup">${one}</div></div></div>`;
  const wrap = bar.querySelector('.tkwrap'), track = bar.querySelector('.tktrack'), g = bar.querySelector('.tkgroup');
  // একটা গ্রুপ স্ক্রিনের চেয়ে ছোট হলে পুনরাবৃত্তি করে ভরাট করা হয়, যাতে ফাঁকা জায়গা না থাকে
  const w1 = g.getBoundingClientRect().width || 1;
  const reps = Math.max(1, Math.ceil(wrap.clientWidth / w1));
  const groupHtml = one.repeat(reps);
  track.innerHTML = `<div class="tkgroup">${groupHtml}</div><div class="tkgroup" aria-hidden="true">${groupHtml}</div>`;
  const total = w1 * reps;
  const speed = window.innerWidth <= 700 ? 45 : 65; // পিক্সেল/সেকেন্ড
  track.style.animationDuration = Math.max(8, total / speed) + 's';
}
(function(){
  const bar = document.getElementById('tickerBar');
  bar.addEventListener('touchstart', ()=>bar.classList.add('paused'), {passive:true});
  ['touchend','touchcancel'].forEach(ev=>bar.addEventListener(ev, ()=>bar.classList.remove('paused'), {passive:true}));
  let rt = null, lastW = window.innerWidth;
  window.addEventListener('resize', ()=>{
    if(window.innerWidth === lastW) return; lastW = window.innerWidth;

})();

// ---- অফারের কাউন্টডাউন ----
function cdParts(ms){
  const t = Math.max(0, Math.floor(ms/1000));
  return { d: Math.floor(t/86400), h: Math.floor((t%86400)/3600), m: Math.floor((t%3600)/60), s: t%60 };
}
function cdPad(n){ return String(n).padStart(2,'0'); }
function fmtOfferEnd(ms){
  const en = document.documentElement.lang === 'en';
  const opt = {day:'numeric', month:'long', year:'numeric', hour:'numeric', minute:'2-digit', hour12:true};
  try{ return new Date(ms).toLocaleString(en?'en-GB':'bn-BD', opt); }
  catch(e){ return new Date(ms).toLocaleString('en-GB', opt); }
}
function offerTick(){
  const now = Date.now();
  if(offers.some(o=>o.endAt && Number(o.endAt)<=now)){
    // সময় শেষ হওয়া অফার সরিয়ে দেওয়া হয় — অফারের ছাড়ও আর থাকে না
    const alive = offers.filter(o=>!o.endAt || Number(o.endAt)>now);
    offers.filter(o=>o.endAt && Number(o.endAt)<=now).forEach(o=>{
      if(o.productId && !alive.some(x=>x.productId===o.productId)) delete offerPriceOverride[o.productId];
    });
    offers = alive; offerIdx = 0;
    renderOfferWidget(); startOfferRotation();
    if(typeof renderProductGrid === 'function') renderProductGrid();
    return;
  }
  const el = document.querySelector('.ofcd');
  if(!el) return;
  const p = cdParts(Number(el.getAttribute('data-end')) - now);
  const set = (cls, v)=>{ const n = el.querySelector(cls); if(n && n.textContent !== v) n.textContent = v; };
  set('.cdD', cdPad(p.d)); set('.cdH', cdPad(p.h)); set('.cdM', cdPad(p.m)); set('.cdS', cdPad(p.s));
  el.classList.toggle('urgent', Number(el.getAttribute('data-end')) - now < 86400000);
}
setInterval(offerTick, 1000);

  box.innerHTML = `<div class="offercard ${imgUrl?'has-img':''}" onclick="offerClick('${o.productId?esc2(o.productId):''}','${o.category?esc2(o.category):''}',${Number(o.discountPercent)||0})">

function getFilteredProducts(){
  let base;
  if(filterCat==='NewArrival'){
    base = [...products].sort((a,b)=>(b.createdAtMs||0)-(a.createdAtMs||0)).slice(0,10);
  } else if(filterCat==='TopSelling'){
    base = products.filter(p=>(p.sold||0)>0).sort((a,b)=>(b.sold||0)-(a.sold||0));
  } else if(filterCat==='MegaDeal'){
    base = products.filter(p=>p.originalPrice && p.originalPrice>p.price && (p.originalPrice-p.price)/p.originalPrice>=0.2);
  } else if(filterCat==='FreeDelivery'){
    base = products.filter(p=>p.freeDelivery);
  } else if(filterCat!=='All'){
    base = products.filter(p=>p.category===filterCat);
  } else {
    base = products;
  }
  return base.filter(p=>
    (filterAge==='All'||p.ageGroup===filterAge) &&
    (filterSize==='All'||p.size===filterSize) &&
    (filterSubcat==='All' || (p.subcategory||'').toLowerCase().includes(filterSubcat.toLowerCase()))
  );
}

  if(!productsLoaded){ grid.innerHTML = '<p>প্রোডাক্ট লোড হচ্ছে...</p>'; return; }
  let filtered = getFilteredProducts();
  if(searchQuery.trim()){
    const q = searchQuery.trim().toLowerCase();
    filtered = filtered.filter(p=>(p.name||'').toLowerCase().includes(q) || (p.subcategory||'').toLowerCase().includes(q));
  }
  if(!filtered.length){ grid.innerHTML = '<p>এই ফিল্টারে কোনো প্রোডাক্ট নেই।</p>'; }
  filtered.forEach(p=>{
    const low = p.stock<=5, out = p.stock<=0;

    const hasDiscount = p.originalPrice && p.originalPrice > p.price;
    const discountPct = hasDiscount ? Math.round((1 - p.price/p.originalPrice)*100) : 0;

function addToCart(id, qty){
  qty = qty||1;
  const p = products.find(x=>x.id===id);
  const stock = p ? (Number(p.stock)||0) : 0;
  const current = cart[id]||0;
  const allowed = Math.max(0, stock - current);
  if(allowed <= 0){ alert(`দুঃখিত, এই প্রোডাক্টের স্টকে মাত্র ${stock} পিস আছে, আর যোগ করা যাবে না।`); return; }
  if(qty > allowed){
    cart[id] = current + allowed;
    alert(`স্টকে মাত্র ${stock} পিস আছে, তাই ${allowed} পিস কার্টে যোগ করা হলো।`);
  } else {
    cart[id] = current + qty;
  }
  updateCartCount();
}

function normalizeBDPhone(raw){
  let d = String(raw||'').replace(/[\s\-()]/g,'').replace(/[০-৯]/g, ch=>'০১২৩৪৫৬৭৮৯'.indexOf(ch));
  d = d.replace(/^\+?88/,'');
  return /^01[3-9]\d{8}$/.test(d) ? d : '';
}
async function placeOrder(){
  const name=document.getElementById('cName').value.trim();
  const phone=normalizeBDPhone(document.getElementById('cPhone').value);
  const addr=document.getElementById('cAddr').value.trim();
  const pay=document.getElementById('cPay').value;
  const deliveryArea=document.getElementById('cArea').value;
  const deliveryCharge=DELIVERY_CHARGES[deliveryArea]||0;
  if(!name){ alert('আপনার নাম দিন'); return; }
  if(!phone){ alert('সঠিক মোবাইল নম্বর দিন (যেমন 01712345678)'); return; }
  if(!addr){ alert('ডেলিভারির ঠিকানা দিন'); return; }
  let trxId = '';
  if(pay !== 'Cash on Delivery'){
    const tEl = document.getElementById('cTrx');
    trxId = (tEl ? tEl.value : '').trim().toUpperCase().replace(/\s+/g,'');
    if(!trxId){ alert('ট্রানজেকশন ID দিন — পেমেন্টের ট্রানজেকশন ID না দিলে অর্ডার কনফার্ম হবে না।'); if(tEl) tEl.focus(); return; }
    if(!/^[A-Z0-9][A-Z0-9\-_\/]{4,39}$/.test(trxId)){ alert('ট্রানজেকশন ID সঠিক নয় — ৫ থেকে ৪০ অক্ষর, শুধু ইংরেজি অক্ষর ও সংখ্যা দিন।'); if(tEl) tEl.focus(); return; }
  }
  const items = Object.entries(cart).filter(([id,q])=>q>0).map(([id,q])=>{ const p=products.find(x=>x.id===id); return {id,name:p.name,price:priceFor(id),qty:q}; });
  if(!items.length){ alert('কার্ট খালি'); return; }
  let stockChanged = false;
  for(const it of items){
    const p = products.find(x=>x.id===it.id);
    const stock = p ? (Number(p.stock)||0) : 0;
    if(it.qty > stock){
      cart[it.id] = stock>0 ? stock : 0;
      if(stock<=0) delete cart[it.id];
      it.qty = stock;
      stockChanged = true;
    }
  }
  if(stockChanged){
    updateCartCount();
    alert('দুঃখিত, কার্টের কিছু প্রোডাক্টের স্টক কমে গেছে, কার্ট আপডেট করা হলো — আবার চেক করে অর্ডার কনফার্ম করুন।');
    closeSheet(); openCart();
    return;
  }
  const subtotal = items.reduce((s,i)=>s+i.price*i.qty,0);
  const total = subtotal + deliveryCharge;
  const orderId = genOrderId();
  try{
    const orderData = { name, phone, addr, pay, items, deliveryArea, deliveryCharge, total, status:'Pending', history:[{status:'Pending', at:Date.now()}], createdAt: firebase.firestore.FieldValue.serverTimestamp() };
    if(trxId) orderData.trxId = trxId;
    await db.collection('orders').doc(orderId).set(orderData);
  }catch(e){ console.error(e); alert('অর্ডার পাঠানো যায়নি, আবার চেষ্টা করুন'); return; }
  rememberOrder(orderId);
  trackOrderIdentity(name, phone);
  for(const it of items){
    try{ await db.collection('products').doc(it.id).update({ stock: firebase.firestore.FieldValue.increment(-it.qty), sold: firebase.firestore.FieldValue.increment(it.qty) }); }
    catch(e){ console.warn('stock update failed', e); }

function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function genOrderId(){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const arr = new Uint32Array(8); crypto.getRandomValues(arr);
  return 'BP-' + Array.from(arr, n=>chars[n % chars.length]).join('');

function rememberOrder(id){
  const list = load('bp_my_orders', []).filter(x=>x!==id);

function fmtDate(ts){
  const d = ts && ts.toDate ? ts.toDate() : (typeof ts==='number' ? new Date(ts) : null);
  if(!d) return '';
  return d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function last10(p){ return String(p||'').replace(/\D/g,'').slice(-10); }

async function trackByForm(){
  let id = document.getElementById('trkId').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');

  if(id.startsWith('BP')) id = id.slice(2);
  if(id.length!==8 || last10(phone).length<10){ alert('সঠিক অর্ডার ID (BP-XXXXXXXX) ও মোবাইল নম্বর দিন'); return; }

    const d = await db.collection('orders').doc(id).get();

  const items = (o.items||[]).map(i=>`<div class="cartrow"><div>${esc(i.name)}<br><small>৳${Number(i.price)||0} × ${Number(i.qty)||0}</small></div><div>৳${(Number(i.price)||0)*(Number(i.qty)||0)}</div></div>`).join('');

    ${o.customerConfirmed
      ? `<div class="courierbox" style="background:#e7f8ef;border-color:#bfe8d1;color:#0e9f6e;font-weight:700">✅ আপনি প্রোডাক্ট রিসিভ নিশ্চিত করেছেন — ধন্যবাদ!</div>`

}
function getDeviceType(){
  const ua = navigator.userAgent || '';
  return /iPad|Tablet/i.test(ua) ? 'Tablet' : (/Mobi|Android|iPhone/i.test(ua) ? 'Mobile' : 'Desktop');
}
function trackVisit(){
  try{
    if(localStorage.getItem('bp_no_track')) return;
    if(sessionStorage.getItem('bp_visit_logged')) return;
    sessionStorage.setItem('bp_visit_logged','1');
    let ref = (new URLSearchParams(location.search).get('ref')||'').trim().slice(0,60);
    if(!ref){ try{ ref = document.referrer ? new URL(document.referrer).hostname.replace(/^www\./,'') : 'Direct'; }catch(e){ ref = 'Direct'; } }
    db.collection('visits').add({ vid:getVisitorId(), at:firebase.firestore.FieldValue.serverTimestamp(), device:getDeviceType(), ref }).catch(()=>{});

}

}

const MAP = {};
PAIRS.forEach(p=>{ if(!(p[1] in MAP)) MAP[p[1]] = p; MAP[p[0]] = p; });

// প্যাটার্ন (সংখ্যা/নাম সহ লেখার জন্য): bn = বাংলায় নেওয়ার নিয়ম (উৎস ইংরেজি), en = ইংরেজিতে নেওয়ার নিয়ম (উৎস বাংলা)
const PAT = [
  {re:/^(\d+) পিস$/, en:m=>m[1]+' pcs'},
  {re:/^(\d+)টি আইটেম$/, en:m=>m[1]+' item(s)'},
  {re:/^(.+?) \(ডেলিভারি চার্জ ৳(\d+)\)$/, en:m=>T(m[1])+' (Delivery charge ৳'+m[2]+')'},
  {re:/^ডেলিভারি চার্জ \((.+?)\)([\s\S]*)$/, en:m=>'Delivery charge ('+T(m[1])+')'+m[2]},
  {re:/^Home \/ Shop(?: \/ (.+))?$/, bn:m=>'হোম / শপ'+(m[1]?' / '+T(m[1]):'')},
  {re:/^Size (\S+)$/, bn:m=>'সাইজ '+m[1]},
  {re:/^(.+) ট্রানজেকশন ID \/ রেফারেন্স নম্বর$/, en:m=>m[1]+' transaction ID / reference number'},
  {re:/^কপি করা যায়নি, নম্বরটি নিজে কপি করুন: (.+)$/, en:m=>'Could not copy — please copy the number yourself: '+m[1]},
  {re:/^দুঃখিত, এই প্রোডাক্টের স্টকে মাত্র (\d+) পিস আছে, আর যোগ করা যাবে না।$/, en:m=>'Sorry, only '+m[1]+' pcs of this product are in stock, so no more can be added.'},
  {re:/^স্টকে মাত্র (\d+) পিস আছে, তাই (\d+) পিস কার্টে যোগ করা হলো।$/, en:m=>'Only '+m[1]+' pcs in stock, so '+m[2]+' pcs were added to your cart.'},
  {re:/^স্টকে আর মাত্র (\d+) পিস যোগ করা যাবে।$/, en:m=>'Only '+m[1]+' more pcs can be added (stock limit).'},
  {re:/^স্টকে মাত্র (\d+) পিস আছে।$/, en:m=>'Only '+m[1]+' pcs in stock.'},
  {re:/^স্টকে মাত্র (\d+) পিস আছে, আর বাড়ানো যাবে না।$/, en:m=>'Only '+m[1]+' pcs in stock — you cannot increase the quantity further.'}
];

const SYM_PRE = /^[\s\u2190-\u21FF\u2300-\u23FF\u2600-\u27BF\u2B00-\u2BFF\u{1F000}-\u{1FAFF}\uFE0F\u200D]+/u;
const SYM_SUF = /[\s\u2190-\u21FF\uFE0F]+$/u;

function T(x){ return trCore(x, LANG); }
function trCore2(s, lang){
  const idx = lang==='bn' ? 0 : 1;
  if(MAP[s]) return MAP[s][idx];
  for(const p of PAT){
    const fn = lang==='bn' ? p.bn : p.en;
    if(!fn) continue;
    const m = s.match(p.re);
    if(m) return fn(m);
  }
  if(s.indexOf(' · ') > -1){
    const parts = s.split(' · ');
    const out = parts.map(x=>trCore(x, lang));
    if(out.join(' · ') !== s) return out.join(' · ');
  }
  const lm = s.match(/^([^:：]{1,40}?)(\s*[:：]\s*)([\s\S]*)$/);
  if(lm && MAP[lm[1]]){
    return MAP[lm[1]][idx] + lm[2] + (lm[3] ? trCore(lm[3], lang) : '');
  }
  return s;
}
function trCore(core, lang){
  if(!core) return core;
  if(MAP[core]) return MAP[core][lang==='bn'?0:1];
  const pm = core.match(SYM_PRE), pre = pm ? pm[0] : '';
  let rest = core.slice(pre.length), suf = '';
  const sm = rest.match(SYM_SUF);
  if(sm){ suf = sm[0]; rest = rest.slice(0, rest.length - suf.length); }
  if((pre || suf) && rest){
    const o = trCore2(rest, lang);
    return o !== rest ? pre + o + suf : core;
  }
  return trCore2(core, lang);
}
function tr(src, lang){
  if(!src) return src;
  const m = src.match(/^(\s*)([\s\S]*?)(\s*)$/);
  if(!m[2]) return src;
  const out = trCore(m[2], lang);
  return out === m[2] ? src : m[1] + out + m[3];
}

// ---------- DOM অনুবাদ ----------
const TREC = new WeakMap(), AREC = new WeakMap();
const SKIP = 'script,style,textarea,#tickerBar,.pname,[data-notr]';
const ATTRS = ['placeholder','aria-label','title','label'];
function skipText(n){
  const p = n.parentElement; if(!p) return true;
  if(p.closest(SKIP)) return true;
  // <option> এর ভ্যালু যদি লেখা থেকেই আসে (যেমন পেমেন্ট মেথড), সেটা অনুবাদ করা যাবে না
  if(p.tagName === 'OPTION' && !p.hasAttribute('value')) return true;
  return false;
}
function trText(n){
  if(skipText(n)) return;
  const v = n.nodeValue, rec = TREC.get(n);
  const src = (rec && v === rec.out) ? rec.src : v;
  const out = tr(src, LANG);
  TREC.set(n, {src, out});
  if(out !== v) n.nodeValue = out;
}
function trAttr(el, a){
  if(!el.hasAttribute(a)) return;
  if(a === 'label' && el.tagName !== 'OPTGROUP') return;
  if(el.parentElement && el.parentElement.closest('script,style,#tickerBar,[data-notr]')) return;
  let r = AREC.get(el); if(!r){ r = {}; AREC.set(el, r); }
  const v = el.getAttribute(a), rec = r[a];
  const src = (rec && v === rec.out) ? rec.src : v;
  const out = tr(src, LANG);
  r[a] = {src, out};
  if(out !== v) el.setAttribute(a, out);
}
function applyNode(node){
  if(node.nodeType === 3){ trText(node); return; }
  if(node.nodeType !== 1) return;
  const tw = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
  let t; while((t = tw.nextNode())) trText(t);
  const els = [node, ...node.querySelectorAll('[placeholder],[aria-label],[title],optgroup[label]')];
  els.forEach(el=>ATTRS.forEach(a=>trAttr(el, a)));
}
function syncLangUI(){
  document.querySelectorAll('.langsw button[data-lang]').forEach(b=>{
    const on = b.getAttribute('data-lang') === LANG;
    if(b.classList.contains('on') !== on) b.classList.toggle('on', on);
    const ap = on ? 'true' : 'false';
    if(b.getAttribute('aria-pressed') !== ap) b.setAttribute('aria-pressed', ap);
  });
  const lt = document.getElementById('langToggle');
  if(lt){
    // একই মান বারবার বসালে MutationObserver আবার চালু হয়ে অসীম লুপ তৈরি করে, তাই শুধু বদলালেই লিখি
    const txt = LANG === 'bn' ? 'EN' : 'BEN', ttl = LANG === 'bn' ? 'Switch to English' : 'বাংলায় দেখুন';
    if(lt.textContent !== txt) lt.textContent = txt;
    if(lt.getAttribute('title') !== ttl) lt.setAttribute('title', ttl);
  }
}
function setLang(l){
  if(l !== 'bn' && l !== 'en') return;
  LANG = l;
  try{ localStorage.setItem('bp_lang', l); }catch(e){}
  document.documentElement.lang = l;
  applyNode(document.body);
  syncLangUI();
  if(typeof renderOfferWidget === 'function') renderOfferWidget(); // অফারের শেষ-সময়ের তারিখ বর্তমান ভাষায়
}
window.setLang = setLang;

// alert / confirm এর মেসেজও বর্তমান ভাষায় দেখাবে
const _alert = window.alert.bind(window), _confirm = window.confirm.bind(window);
window.alert = m => _alert(tr(String(m), LANG));
window.confirm = m => _confirm(tr(String(m), LANG));

// নতুন তৈরি হওয়া অংশ (প্রোডাক্ট লিস্ট, পপ-আপ, কার্ট ইত্যাদি) নিজে থেকেই অনুবাদ হবে
new MutationObserver(muts=>{
  for(const m of muts){
    if(m.type === 'childList') m.addedNodes.forEach(applyNode);
    else if(m.type === 'characterData') trText(m.target);
    else if(m.type === 'attributes') trAttr(m.target, m.attributeName);
  }
  syncLangUI();
}).observe(document.body, {childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:ATTRS});

document.documentElement.lang = LANG;
applyNode(document.body);
syncLangUI();
</script>
